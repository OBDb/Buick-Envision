generations:
  - name: "First Generation"
    start_year: 2014
    end_year: 2018
    description: "The first-generation Buick Envision was a compact luxury crossover initially launched in China in August 2014 (October on-sale date) before being introduced to North America in 2016. Built on GM's D2XX (Delta II) platform, it slotted between the subcompact Encore and the larger Enclave in Buick's lineup. In North America, it was powered by a 2.0L turbocharged four-cylinder engine producing 252 HP and 260 lb-ft of torque, paired with a six-speed automatic transmission and standard all-wheel drive. A 2.5L naturally aspirated four-cylinder with 197 HP and 192 lb-ft torque was added as a more affordable option. The interior featured premium appointments including available leather seating, heated/ventilated front seats, and an 8-inch infotainment system. The Envision was initially offered with all-wheel drive only in 2016, with optional front-wheel drive added for model year 2017. The North American version was sold from 2016-2018 (pre-facelift) with Premium I and Premium II trim levels initially, expanding to five trim levels for 2017."

  - name: "First Generation (2019 Facelift)"
    start_year: 2019
    end_year: 2020
    description: "The 2019 Envision facelift debuted in late 2017 in China and in 2018 for the North American market. It features revised rear styling and tail lights, revised seating design, and stop/start calibration updates. For the North American market, the transmission for the 2.0-liter turbo engine was upgraded to a 9-speed automatic. This facelift represented mid-generation visual and technological refinements while maintaining the same D2XX platform. The 2019 facelift continued the 20T and 28T trim naming convention with updated technology and styling."

  - name: "Second Generation"
    start_year: 2021
    end_year: 2023
    description: "The second-generation Envision was introduced in May 2020 and launched for the 2021 model year in North America. Built on GM's E2XX platform (shared with Cadillac XT4), it features more athletic styling with a lower, wider stance and sharper design elements aligned with Buick's modern design language. It is powered by a 2.0L turbocharged four-cylinder engine producing 228 HP and 258 lb-ft of torque, paired with a nine-speed automatic transmission. Available in front-wheel or all-wheel drive configurations, the new Envision emphasizes technology with a standard 10.2-inch touchscreen (on higher trims), wireless Apple CarPlay and Android Auto, and enhanced driver assistance features including blind spot monitor, lane departure warning, and forward collision alert. Four trim levels are offered: base, Preferred, Essence, and Avenir (Buick's premium trim with unique styling, quilted leather seats, navigation, and driver assistance technology package). The interior quality saw significant improvements with more premium materials and a driver-focused cockpit design."

  - name: "Second Generation (2024 Refresh)"
    start_year: 2024
    end_year: null
    description: "The Envision received a facelift for the 2024 model year with front design changes and new dashboard-mounted digital displays. This refresh maintains the E2XX platform while updating the styling and interior technology. The 2024 refresh continues the same 2.0L turbocharged four-cylinder engine (228 HP, 258 lb-ft torque) and 9-speed automatic transmission. Super Cruise autonomous driving was planned but not realized due to delays in its broader launch."
